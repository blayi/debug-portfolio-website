<svg xmlns="http://www.w3.org/2000/svg" width="2200" height="2500" viewBox="0 0 2200 2500">
  <defs>
    <style>
      .canvas { fill: #f3f4f6; }
      .page { fill: #ffffff; stroke: #374151; stroke-width: 3; }
      .panel { fill: #ffffff; stroke: #6b7280; stroke-width: 2; }
      .placeholder { fill: #e5e7eb; stroke: #6b7280; stroke-width: 2; }
      .dark { fill: #1f2937; }
      .button { fill: #d1d5db; stroke: #374151; stroke-width: 2; }
      .rule { stroke: #9ca3af; stroke-width: 3; stroke-linecap: round; }
      .image-x { stroke: #9ca3af; stroke-width: 3; }
      .title { font-family: Arimo, Arial, sans-serif; font-size: 38px; font-weight: 700; fill: #111827; }
      .page-name { font-family: Arimo, Arial, sans-serif; font-size: 30px; font-weight: 700; fill: #111827; }
      .heading { font-family: Arimo, Arial, sans-serif; font-size: 24px; font-weight: 700; fill: #111827; }
      .body { font-family: Arimo, Arial, sans-serif; font-size: 19px; fill: #374151; }
      .small { font-family: Arimo, Arial, sans-serif; font-size: 16px; fill: #4b5563; }
      .nav { font-family: Arimo, Arial, sans-serif; font-size: 17px; font-weight: 700; fill: #ffffff; }
      .footer { font-family: Arimo, Arial, sans-serif; font-size: 16px; fill: #ffffff; }
    </style>
  </defs>

  <rect class="canvas" width="2200" height="2500"/>
  <text class="title" x="60" y="62">Portfolio Website - Four-Page Wireframe</text>
  <text class="small" x="60" y="94">Low-fidelity layout plan: shared navigation, five image placements, data table, and accessible contact form</text>

  <!-- HOME PAGE -->
  <g id="home-page" transform="translate(60 130)">
    <rect class="page" width="1000" height="1080" rx="8"/>
    <rect class="dark" x="0" y="0" width="1000" height="120" rx="6"/>
    <text class="nav" x="40" y="54">MY PORTFOLIO</text>
    <text class="nav" x="540" y="54">HOME</text>
    <text class="nav" x="630" y="54">ABOUT</text>
    <text class="nav" x="730" y="54">PROJECTS</text>
    <text class="nav" x="855" y="54">CONTACT</text>
    <text class="small" x="40" y="102" fill="#ffffff">Shared header and navigation</text>

    <text class="page-name" x="40" y="174">HOME</text>
    <rect class="panel" x="40" y="205" width="920" height="360" rx="4"/>
    <text class="heading" x="72" y="252">Hero introduction</text>
    <line class="rule" x1="72" y1="282" x2="430" y2="282"/>
    <line class="rule" x1="72" y1="312" x2="385" y2="312"/>
    <line class="rule" x1="72" y1="342" x2="410" y2="342"/>
    <rect class="button" x="72" y="392" width="170" height="52" rx="6"/>
    <text class="body" x="108" y="426">View projects</text>
    <rect class="placeholder" x="530" y="240" width="380" height="280" rx="4"/>
    <line class="image-x" x1="530" y1="240" x2="910" y2="520"/>
    <line class="image-x" x1="910" y1="240" x2="530" y2="520"/>
    <text class="body" x="640" y="392">Hero image 1/5</text>

    <rect class="panel" x="40" y="595" width="920" height="330" rx="4"/>
    <text class="heading" x="72" y="642">About preview</text>
    <line class="rule" x1="72" y1="680" x2="860" y2="680"/>
    <line class="rule" x1="72" y1="715" x2="820" y2="715"/>
    <line class="rule" x1="72" y1="750" x2="850" y2="750"/>
    <line class="rule" x1="72" y1="785" x2="660" y2="785"/>
    <rect class="button" x="72" y="830" width="150" height="48" rx="6"/>
    <text class="body" x="105" y="862">About me</text>

    <rect class="dark" x="0" y="980" width="1000" height="100"/>
    <text class="footer" x="405" y="1026">Contact details</text>
    <text class="footer" x="370" y="1054">Copyright / social links</text>
  </g>

  <!-- ABOUT PAGE -->
  <g id="about-page" transform="translate(1140 130)">
    <rect class="page" width="1000" height="1080" rx="8"/>
    <rect class="dark" x="0" y="0" width="1000" height="120" rx="6"/>
    <text class="nav" x="40" y="54">MY PORTFOLIO</text>
    <text class="nav" x="540" y="54">HOME</text>
    <text class="nav" x="630" y="54">ABOUT</text>
    <text class="nav" x="730" y="54">PROJECTS</text>
    <text class="nav" x="855" y="54">CONTACT</text>
    <text class="small" x="40" y="102" fill="#ffffff">Shared header and navigation</text>

    <text class="page-name" x="40" y="174">ABOUT</text>
    <rect class="panel" x="40" y="205" width="920" height="310" rx="4"/>
    <rect class="placeholder" x="72" y="240" width="260" height="230" rx="4"/>
    <line class="image-x" x1="72" y1="240" x2="332" y2="470"/>
    <line class="image-x" x1="332" y1="240" x2="72" y2="470"/>
    <text class="small" x="125" y="365">Profile image 2/5</text>
    <text class="heading" x="385" y="262">Background</text>
    <line class="rule" x1="385" y1="300" x2="890" y2="300"/>
    <line class="rule" x1="385" y1="335" x2="850" y2="335"/>
    <line class="rule" x1="385" y1="370" x2="875" y2="370"/>
    <line class="rule" x1="385" y1="405" x2="790" y2="405"/>

    <rect class="panel" x="40" y="545" width="920" height="380" rx="4"/>
    <text class="heading" x="72" y="592">Skills and education table</text>
    <rect class="placeholder" x="72" y="625" width="856" height="230"/>
    <line class="image-x" x1="72" y1="680" x2="928" y2="680"/>
    <line class="image-x" x1="72" y1="738" x2="928" y2="738"/>
    <line class="image-x" x1="72" y1="796" x2="928" y2="796"/>
    <line class="image-x" x1="400" y1="625" x2="400" y2="855"/>
    <text class="body" x="98" y="662">Skill / qualification</text>
    <text class="body" x="430" y="662">Details / experience</text>
    <text class="small" x="98" y="717">Row 1</text>
    <text class="small" x="98" y="775">Row 2</text>
    <text class="small" x="98" y="833">Row 3</text>

    <rect class="dark" x="0" y="980" width="1000" height="100"/>
    <text class="footer" x="405" y="1026">Contact details</text>
    <text class="footer" x="370" y="1054">Copyright / social links</text>
  </g>

  <!-- PROJECTS PAGE -->
  <g id="projects-page" transform="translate(60 1290)">
    <rect class="page" width="1000" height="1080" rx="8"/>
    <rect class="dark" x="0" y="0" width="1000" height="120" rx="6"/>
    <text class="nav" x="40" y="54">MY PORTFOLIO</text>
    <text class="nav" x="540" y="54">HOME</text>
    <text class="nav" x="630" y="54">ABOUT</text>
    <text class="nav" x="730" y="54">PROJECTS</text>
    <text class="nav" x="855" y="54">CONTACT</text>
    <text class="small" x="40" y="102" fill="#ffffff">Shared header and navigation</text>

    <text class="page-name" x="40" y="174">PROJECTS</text>
    <text class="body" x="40" y="208">Three semantic project articles</text>

    <g transform="translate(40 245)">
      <rect class="panel" width="280" height="620" rx="4"/>
      <rect class="placeholder" x="20" y="20" width="240" height="250" rx="4"/>
      <line class="image-x" x1="20" y1="20" x2="260" y2="270"/>
      <line class="image-x" x1="260" y1="20" x2="20" y2="270"/>
      <text class="small" x="70" y="150">Project image 3/5</text>
      <text class="heading" x="20" y="320">Project One</text>
      <line class="rule" x1="20" y1="355" x2="250" y2="355"/>
      <line class="rule" x1="20" y1="388" x2="230" y2="388"/>
      <line class="rule" x1="20" y1="421" x2="240" y2="421"/>
      <rect class="button" x="20" y="475" width="130" height="46" rx="6"/>
      <text class="small" x="48" y="505">View project</text>
    </g>
    <g transform="translate(360 245)">
      <rect class="panel" width="280" height="620" rx="4"/>
      <rect class="placeholder" x="20" y="20" width="240" height="250" rx="4"/>
      <line class="image-x" x1="20" y1="20" x2="260" y2="270"/>
      <line class="image-x" x1="260" y1="20" x2="20" y2="270"/>
      <text class="small" x="70" y="150">Project image 4/5</text>
      <text class="heading" x="20" y="320">Project Two</text>
      <line class="rule" x1="20" y1="355" x2="250" y2="355"/>
      <line class="rule" x1="20" y1="388" x2="230" y2="388"/>
      <line class="rule" x1="20" y1="421" x2="240" y2="421"/>
      <rect class="button" x="20" y="475" width="130" height="46" rx="6"/>
      <text class="small" x="48" y="505">View project</text>
    </g>
    <g transform="translate(680 245)">
      <rect class="panel" width="280" height="620" rx="4"/>
      <rect class="placeholder" x="20" y="20" width="240" height="250" rx="4"/>
      <line class="image-x" x1="20" y1="20" x2="260" y2="270"/>
      <line class="image-x" x1="260" y1="20" x2="20" y2="270"/>
      <text class="small" x="70" y="150">Project image 5/5</text>
      <text class="heading" x="20" y="320">Project Three</text>
      <line class="rule" x1="20" y1="355" x2="250" y2="355"/>
      <line class="rule" x1="20" y1="388" x2="230" y2="388"/>
      <line class="rule" x1="20" y1="421" x2="240" y2="421"/>
      <rect class="button" x="20" y="475" width="130" height="46" rx="6"/>
      <text class="small" x="48" y="505">View project</text>
    </g>

    <rect class="dark" x="0" y="980" width="1000" height="100"/>
    <text class="footer" x="405" y="1026">Contact details</text>
    <text class="footer" x="370" y="1054">Copyright / social links</text>
  </g>

  <!-- CONTACT PAGE -->
  <g id="contact-page" transform="translate(1140 1290)">
    <rect class="page" width="1000" height="1080" rx="8"/>
    <rect class="dark" x="0" y="0" width="1000" height="120" rx="6"/>
    <text class="nav" x="40" y="54">MY PORTFOLIO</text>
    <text class="nav" x="540" y="54">HOME</text>
    <text class="nav" x="630" y="54">ABOUT</text>
    <text class="nav" x="730" y="54">PROJECTS</text>
    <text class="nav" x="855" y="54">CONTACT</text>
    <text class="small" x="40" y="102" fill="#ffffff">Shared header and navigation</text>

    <text class="page-name" x="40" y="174">CONTACT</text>
    <rect class="panel" x="40" y="205" width="920" height="720" rx="4"/>
    <text class="heading" x="72" y="252">Send a message</text>
    <text class="small" x="72" y="292">Name *</text>
    <rect class="placeholder" x="72" y="307" width="390" height="54" rx="4"/>
    <text class="small" x="510" y="292">Email *</text>
    <rect class="placeholder" x="510" y="307" width="390" height="54" rx="4"/>
    <text class="small" x="72" y="400">Phone</text>
    <rect class="placeholder" x="72" y="415" width="390" height="54" rx="4"/>
    <text class="small" x="510" y="400">Enquiry type *</text>
    <rect class="placeholder" x="510" y="415" width="390" height="54" rx="4"/>
    <text class="small" x="72" y="508">Preferred contact method</text>
    <circle class="placeholder" cx="90" cy="548" r="14"/>
    <text class="small" x="116" y="554">Email</text>
    <circle class="placeholder" cx="220" cy="548" r="14"/>
    <text class="small" x="246" y="554">Phone</text>
    <rect class="placeholder" x="380" y="534" width="28" height="28" rx="3"/>
    <text class="small" x="422" y="554">Send me a copy</text>
    <text class="small" x="72" y="605">Message *</text>
    <rect class="placeholder" x="72" y="620" width="828" height="150" rx="4"/>
    <rect class="button" x="72" y="810" width="170" height="52" rx="6"/>
    <text class="body" x="113" y="844">Send message</text>

    <rect class="dark" x="0" y="980" width="1000" height="100"/>
    <text class="footer" x="405" y="1026">Contact details</text>
    <text class="footer" x="370" y="1054">Copyright / social links</text>
  </g>
</svg>
