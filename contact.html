<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta
    name="description"
    content="Contact Siyasanga Blayi about web development projects and opportunities."
  >
  <title>Contact | Siyasanga Blayi</title>
  <link rel="stylesheet" href="css/styles.css">
</head>

<body>
  <header class="header">
    <h1>Contact Me</h1>

    <nav aria-label="Primary navigation">
      <ul>
        <li><a href="index.html">Home</a></li>
        <li><a href="about.html">About</a></li>
        <li><a href="projects.html">Projects</a></li>
        <li>
          <a href="contact.html" aria-current="page">Contact</a>
        </li>
      </ul>
    </nav>
  </header>

  <main>
    <section class="contact-section" aria-labelledby="contact-title">
      <h2 id="contact-title">Get in Touch</h2>
      <p>Complete the form below to send me a message.</p>

      <form action="#" method="post">
        <label for="name">Full name</label>
        <input
          type="text"
          id="name"
          name="name"
          required
          minlength="2"
          maxlength="60"
        >

        <label for="email">Email address</label>
        <input
          type="email"
          id="email"
          name="email"
          required
        >

        <label for="phone">Phone number</label>
        <input
          type="tel"
          id="phone"
          name="phone"
          pattern="[0-9+ ]{10,15}"
          placeholder="+27 82 123 4567"
        >

        <label for="subject">Enquiry type</label>
        <select id="subject" name="subject" required>
          <option value="" disabled selected>Select an option</option>
          <option value="project">Project enquiry</option>
          <option value="opportunity">Work opportunity</option>
          <option value="feedback">Website feedback</option>
        </select>

        <fieldset>
          <legend>Preferred contact method</legend>

          <label>
            <input
              type="radio"
              name="contact-method"
              value="email"
              required
            >
            Email
          </label>

          <label>
            <input
              type="radio"
              name="contact-method"
              value="phone"
            >
            Phone
          </label>
        </fieldset>

        <label class="checkbox-label">
          <input type="checkbox" name="send-copy">
          Send me a copy of my message
        </label>

        <label for="message">Message</label>
        <textarea
          id="message"
          name="message"
          rows="6"
          required
          minlength="10"
          maxlength="500"
        ></textarea>

        <button type="submit">Send message</button>
      </form>
    </section>
  </main>

  <footer class="footer">
    <p>
      Contact me at
      <a href="mailto:siyasanga.blayi@umuzi.org">
        siyasanga.blayi@umuzi.org
      </a>
    </p>
  </footer>
</body>
</html>
